defaults:
- model/mlp_policy@actor.model
- state_ppo
- _self_
runner:
  # 256 envs x 64 steps = 16384 env steps per epoch; 1500 epochs ~ 2.5e7 steps.
  max_epochs: 1500
  save_interval: 50
  keep_last_checkpoints: 1
  logger:
    experiment_name: piper_pick
algorithm:
  update_epoch: 5
  entropy_bonus: 0.005
env:
  train:
    total_num_envs: 256
    max_steps_per_rollout_epoch: 64
    max_episode_steps: 500
    init_params:
      id: piper_pick/Workspace-Planner-Executor-v0
      # isaaclab3 | isaac | mjlab; physics (isaaclab3 only): newton | ovphysx.
      # The same scene.yaml/policy.py/task.py; evaluation follows this choice.
      backend: isaaclab3
      physics: newton
  # evaluate: same environment, each round runs one whole episode.
  eval:
    total_num_envs: 16
    max_steps_per_rollout_epoch: ${env.train.max_episode_steps}
actor:
  global_batch_size: 4096
  micro_batch_size: 1024
  model:
    model_type: piper_pick__planner_executor_policy
    obs_dim: null
    action_dim: auto
    hidden_dims:
    - 256
    - 128
