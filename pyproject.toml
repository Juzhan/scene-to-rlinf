[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-project-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3", "omegaconf>=2.3", "ruamel.yaml>=0.18,<0.19"]

[tool.setuptools.packages.find]
where = ["."]
include = ["projects*", "shared*", "tools*"]
