defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:WORKSPACE_ROOT}/outputs/${runner.logger.experiment_name}
    project_name: rlinf-workspace
    experiment_name: default
    logger_backends: [tensorboard]
  max_epochs: 20
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: ${runner.max_epochs}
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  update_epoch: 2
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  bootstrap_type: standard
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.01
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
env:
  group_name: EnvGroup
  train:
    env_type: isaaclab
    total_num_envs: 64
    rollout_epoch: 1
    group_size: 1
    seed: 42
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_coef: 1.0
    use_fixed_reset_state_ids: false
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 32
    is_eval: false
    enable_offload: false
    video_cfg:
      save_video: false
    init_params:
      backend: isaac
      obs_dim: ${actor.model.obs_dim}
      action_dim: ${actor.model.action_dim}
      device: cuda:0
      task_description: ''
  eval: ${env.train}
rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: -1
    top_p: 1.0
    max_new_tokens: 1
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_final_values: true
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ''
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 512
  seed: 42
  enable_offload: false
  model:
    model_type: ???
    model_path: ''
    policy_setup: joint-position
    num_action_chunks: 1
    precision: '32'
    add_value_head: true
    is_lora: false
    network: upstream
  optim:
    lr: 0.0003
    value_lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
  fsdp_config:
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
